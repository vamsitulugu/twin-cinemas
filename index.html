<!doctype html><html lang="en"><head><meta charset="utf-8">
<link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#0b0812"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Twin Cinema</title><link rel="stylesheet" href="/src/style.css"></head><body>
<div id="loading">LOADING THEATRE…</div>
<div id="door-ui"><h1>TWIN CINEMA</h1><p>Two seats. One screen. Any distance.</p><input id="room" placeholder="Room code (share it with your love)" maxlength="24"><div id="roles"><button data-r="1">💗 I'm Person 1</button> <button data-r="2">💙 I'm Person 2</button></div><button id="open" class="main" disabled hidden>🚪 Open the door</button><small id="dstat"></small></div>
<div id="hud"><div id="tip"></div><div id="bar"></div></div>
<div id="seek"><span id="tc">0:00</span><input id="sk" type="range" min="0" max="1000" value="0"><span id="td">0:00</span></div>
<div id="chat"><input id="ci" placeholder="Say something… (appears above your head)" maxlength="80"><button id="cs">➤</button></div>
<div id="top-r"><button id="snd">🔔</button><button id="leave">✕ Leave</button></div><div id="joy"><i></i></div>
<div id="ov"></div>
<div id="fv"><div class="slot"></div><div id="fc"><button id="fp">⏸</button><span id="ftc">0:00</span><input id="fsk" type="range" min="0" max="1000" value="0"><button id="fm">🔊</button><button id="fx">✕</button></div></div><div id="dbg"></div>
<script type="module" src="/src/main.js"></script></body></html>
